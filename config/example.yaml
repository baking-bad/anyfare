# The staging-shaped platform config, for local development and tests.
#
# Loaded from CONFIG_PATH: one file, or several separated by commas, merged left to right (objects merge
# by key, lists replace). CONFIG, base64 of YAML or JSON, merges last.
#
# Every address here is a placeholder. Quote addresses: YAML reads an unquoted 0x… as a number.
version: 1
environment: staging

logger:
  level: info

urls:
  website: https://anyfare.test
  api: https://api.anyfare.test
  pay: https://pay.anyfare.test

# Extra hosts and IP addresses we own. The hosts of urls are always included.
ownHosts: []

# The first characters of a key tell its kind
keyPrefixes:
  master: afm_test_
  payment: af_test_

# What a new payment key gets unless the account says otherwise
paymentKeyDefaults:
  dailyBudget: "5"

# The fee on top of a routed target's price, in basis points (0 to 10000)
routingFeeBps: 0

# Every token we pay APIs in or take payments in. payTo is our address that receives the asset from
# buyers: without it the asset is not offered to buyers.
assets:
  - name: base-usdc
    network: eip155:84532
    address: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
    decimals: 6
    peg: usd
    payTo: "0x1111111111111111111111111111111111111111"
  - name: solana-usdc
    network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
    address: 4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU
    decimals: 6
    peg: usd
    payTo: "11111111111111111111111111111111"
  - name: tempo-pathusd
    network: eip155:42431
    address: "0x20c0000000000000000000000000000000000000"
    decimals: 6
    peg: usd
    payTo: "0x2222222222222222222222222222222222222222"
  - name: near-usdc
    network: near:testnet
    address: 3e2210e1184b45b64c8a434c0a7e7b23cc04ea7eb7a6c3c32520d03d4afcb8af
    decimals: 6
    peg: usd
    payTo: pay.anyfare.testnet

# One facilitator per network. Auth names environment variables; their values are never in this file.
facilitators:
  - name: cdp
    url: https://api.cdp.coinbase.com/platform/v2/x402
    networks: [eip155:84532, solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1]
    auth:
      type: cdp
      apiKeyId: CDP_API_KEY_ID
      apiKeySecret: CDP_API_KEY_SECRET
    enabled: true               # Optional. Default: true. A disabled one isn't checked, and its networks aren't offered
  - name: near
    url: http://127.0.0.1:8084
    networks: [near:testnet]
    auth:                       # A static key, sent in the X-API-Key header
      type: api-key
      apiKey: FACILITATOR_SECRET

# The Tempo charge. Tempo assets are paid through it, so they need no facilitator.
mpp:
  network: eip155:42431
  recipient: "0x2222222222222222222222222222222222222222"   # Optional. Without it MPP is not offered to buyers
  enabled: true                 # Optional. Default: true. A disabled MPP isn't offered, and its RPC isn't checked
  # rpcUrl: https://rpc.moderato.tempo.xyz   # Optional. HTTPS, without credentials. Default: the chain's public RPC

rateLimits:
  paymentKey: { requests: 600, windowSeconds: 60 }
  unpaidIp: { requests: 60, windowSeconds: 60 }
  signup: { requests: 10, windowSeconds: 3600 }   # Per client IP
  # documents: { requests: 120, windowSeconds: 60 }   # Optional. Public documents per client IP. Default: 120 a minute
  # probeIp: { requests: 600, windowSeconds: 60 }   # Optional. Probes of routed targets per client IP, paid calls too. Default: 600 a minute
  # topups: { requests: 20, windowSeconds: 3600 }   # Optional. Top-ups each account may ask for. Default: 20 an hour
  # publicReads: { requests: 120, windowSeconds: 60 }   # Optional. Public reads of calls per client IP; a stream counts when it opens. Default: 120 a minute

# Optional. Open streams of calls on each API process. Over a cap, a new stream gets 429. The values are the defaults
# callStream:
#   maxPerIp: 20                # Per client IP
#   maxTotal: 1000              # In all

# Optional. The public numbers the workers count from the calls and top-ups. The values are the defaults
# stats:
#   intervalSeconds: 300        # The pause between one count of today, 7 and 30 days and the next: 10 to 86400
#   allIntervalSeconds: 3600    # The pause between one count of all time and the next: 60 to 604800
#   maxServices: 1000           # Services with pages of their own, by paid calls over 30 days: 1 to 10000

# Optional. Free Credits for each new account, so a visitor can try the service without a wallet. The values are the
# defaults, except maxPerDay, which has none
# freeCredits:
#   enabled: false              # The operator turns the gift on
#   amount: "0.1"               # What each new account gets: more than 0, at most 10
#   perIp: { requests: 3, windowSeconds: 86400 }   # New accounts per client IP that get it. Later ones are created with none
#   maxPerDay: "5"              # Optional. The most given across all IPs in one UTC day, at least amount. Without it there is no cap

# Optional. Top-ups: any token on any chain, sent to a deposit address, swapped to the asset by the 1Click API of
# NEAR Intents and delivered to recipient. Without the section they are off. Tests turn them on with an override
topups:
  enabled: false                # Default: false. When true, asset, recipient, refundTo and one network are required
  url: http://127.0.0.1:8085    # Default: https://1click.chaindefuser.com
  # apiKey: ONECLICK_API_KEY    # Optional. The environment variable that holds the 1Click key, never the key
  asset: near-usdc              # The registry asset 1Click delivers: one on a NEAR network
  recipient: treasury.anyfare.testnet   # The NEAR account that receives the asset
  refundTo: treasury.anyfare.testnet    # The account inside intents.near that receives refunds
  # slippageBps: 100            # Default: 100. From 1 to 5000
  # deadlineMinutes: { stablecoin: 1440, other: 120 }   # The defaults. How long an address takes transfers: 10 to 10080
  # stablecoins: [USDC, USDT, USDT0, DAI, USD1]         # The default. Symbols, compared without case
  # timeoutMs: 15000            # Default: 15000. Each call to 1Click
  networks:                     # What a client sends, 1Click's name for it, and the least a top-up there must be worth in USD
    - { name: base, blockchain: base, minimum: "1" }
    - { name: arbitrum, blockchain: arb, minimum: "1" }
    - { name: solana, blockchain: sol, minimum: "1" }
    - { name: near, blockchain: near, minimum: "1" }
    - { name: ethereum, blockchain: eth, minimum: "5" }
    - { name: bitcoin, blockchain: btc, minimum: "10" }

timeouts:
  connectMs: 5000
  requestMs: 30000
  settleMs: 30000

sizeLimits:                     # Optional. These are the defaults
  requestBodyBytes: 1048576
  bufferedResponseBytes: 10485760

signer:                         # Optional. What one routed call and one network can cost us
  maxPerCall: "1"
  maxPerNetworkPerDay: "100"
  # maxPerNetworkPerHour: "10"  # Optional. No default: without it there is no hourly limit
  # wallets:                    # Optional: the hot wallets' public addresses, for the balance monitor. Never their keys
  #   base: "0x…"
  #   tempo: "0x…"
  #   solana: "…"               # In base58
  #   near: pay.anyfare.testnet # An account ID: near-usdc's payTo, which also pays NEAR targets. SIGNER_NEAR_ACCOUNT must match
