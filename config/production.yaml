# The production platform config: mainnets only. Loaded the same way as example.yaml: CONFIG_PATH,
# several files merged left to right, CONFIG last.
version: 1
environment: production

logger:
  level: info

urls:
  website: https://anyfare.agents.bakingbad.dev
  api: https://api.anyfare.agents.bakingbad.dev
  pay: https://pay.anyfare.agents.bakingbad.dev
  console: https://console.anyfare.agents.bakingbad.dev

# Extra hosts and IP addresses we own. The hosts of urls are always included.
ownHosts: []

# The first characters of a key tell its kind
keyPrefixes:
  master: afm_live_
  payment: af_live_

paymentKeyDefaults:
  dailyBudget: "5"

# The fee on top of a routed target's price, in basis points
routingFeeBps: 0

# The receiving addresses (payTo). Quote an EVM one: YAML reads an unquoted 0x… as a number. An asset
# without one is not offered to buyers. Each payTo is also the Signer's hot wallet on its chain, so what
# buyers pay there refills it.
assets:
  - name: base-usdc
    network: eip155:8453
    address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    decimals: 6
    peg: usd
    payTo: "0xf82B4B95a063CFd5F56B3395978d02278E583550"
  - name: solana-usdc
    network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
    address: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    decimals: 6
    peg: usd
    payTo: AzG7Gmu8t6r54JbdAxZBNHNvCzbf5QDZcdKe7Aho78Xj
  - name: tempo-usdce
    network: eip155:4217
    address: "0x20C000000000000000000000b9537d11c60E8b50"
    decimals: 6
    peg: usd
    # The MPP recipient
    payTo: "0xf82B4B95a063CFd5F56B3395978d02278E583550"
  - name: near-usdc
    network: near:mainnet
    address: 17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
    decimals: 6
    peg: usd
    # Our NEAR hot wallet: buyers pay it, and the Signer pays NEAR targets from it
    payTo: pay.anyfare.near

# One facilitator per network. Auth names environment variables; their values are never in this file.
facilitators:
  - name: cdp
    url: https://api.cdp.coinbase.com/platform/v2/x402
    networks: [eip155:8453, solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp]
    auth:
      type: cdp
      apiKeyId: CDP_API_KEY_ID
      apiKeySecret: CDP_API_KEY_SECRET
  - name: near
    url: http://facilitator:8084
    networks: [near:mainnet]
    auth:
      type: api-key
      apiKey: FACILITATOR_SECRET

# The Tempo charge, paid to our Tempo address, the tempo-usdce asset's payTo
mpp:
  network: eip155:4217
  recipient: "0xf82B4B95a063CFd5F56B3395978d02278E583550"

rateLimits:
  paymentKey: { requests: 600, windowSeconds: 60 }
  unpaidIp: { requests: 60, windowSeconds: 60 }
  # A hackathon venue shares one IP, so the sign-up limit is high.
  signup: { requests: 200, windowSeconds: 3600 }
  # The website's server reads the public documents for every visitor, from one IP
  documents: { requests: 600, windowSeconds: 60 }
  # Public reads of calls and numbers count each visitor: the website's server forwards the visitor's
  # address, and the API takes it from the stack's network. A page reads several at once.
  publicReads: { requests: 300, windowSeconds: 60 }

# A hackathon venue shares one IP, and each visitor's browser opens its own stream of calls
callStream:
  maxPerIp: 200

# Free Credits for each new account
freeCredits:
  enabled: true
  amount: "0.1"
  perIp: { requests: 3, windowSeconds: 86400 }   # Per client IP. Later accounts are created with none
  maxPerDay: "5"   # The most given across all IPs in one UTC day: 50 gifts

# Top-ups: a client sends any token on any chain to a deposit address, and the 1Click API of NEAR Intents
# swaps it to near-usdc and delivers it to the recipient.
topups:
  enabled: true
  # When we have a 1Click key, name the variable that holds it here: apiKey: ONECLICK_API_KEY
  asset: near-usdc
  recipient: treasury.anyfare.near
  # Refunds are held for this account inside intents.near
  refundTo: treasury.anyfare.near
  networks:
    - { name: base, blockchain: base, minimum: "1" }
    - { name: arbitrum, blockchain: arb, minimum: "1" }
    - { name: solana, blockchain: sol, minimum: "1" }
    - { name: near, blockchain: near, minimum: "1" }
    - { name: ethereum, blockchain: eth, minimum: "5" }
    - { name: bitcoin, blockchain: btc, minimum: "10" }

# Rebalancing: the Signer refills its hot wallets on Base and Solana with near-usdc from its NEAR hot wallet,
# through 1Click at topups.url. Off until the operator turns it on.
rebalancing:
  enabled: false
  source: near-usdc
  # In USD: the least and the most per refill, and the most per target asset per UTC day
  leastPerRefill: "1"
  mostPerRefill: "10"
  mostPerAssetPerDay: "20"
  # 1Click's cost at most 2% of the amount, and 0.5% of slippage
  maxFeeBps: 200
  slippageBps: 50
  # 1Click refunds a swap unfinished after 30 minutes. The workers check every 5 minutes.
  deadlineMinutes: 30
  intervalSeconds: 300
  # Below floor, a hot wallet is refilled up to target, in USD. blockchain is 1Click's name for the network.
  targets:
    - { asset: base-usdc, blockchain: base, floor: "5", target: "10" }
    - { asset: solana-usdc, blockchain: sol, floor: "3", target: "6" }

timeouts:
  connectMs: 5000
  requestMs: 30000
  settleMs: 30000

# What one routed call and one network can cost us, and the hot wallets' public addresses, never their
# keys. Base and Tempo share one key, so one address.
signer:
  maxPerCall: "0.1"
  maxPerNetworkPerHour: "5"
  maxPerNetworkPerDay: "20"
  wallets:
    base: "0xf82B4B95a063CFd5F56B3395978d02278E583550"
    tempo: "0xf82B4B95a063CFd5F56B3395978d02278E583550"
    solana: AzG7Gmu8t6r54JbdAxZBNHNvCzbf5QDZcdKe7Aho78Xj
    near: pay.anyfare.near
