# The production platform config: mainnets only. Loaded the same way as example.yaml: CONFIG_PATH,
# several files merged left to right, CONFIG last.
version: 1
environment: production

logger:
  level: info

urls:
  website: https://anyfare.agents.bakingbad.dev
  api: https://api.anyfare.agents.bakingbad.dev
  pay: https://pay.anyfare.agents.bakingbad.dev

# Extra hosts and IP addresses we own. The hosts of urls are always included.
ownHosts: []

# The first characters of a key tell its kind
keyPrefixes:
  master: afm_live_
  payment: af_live_

paymentKeyDefaults:
  dailyBudget: "5"

# The fee on top of a routed target's price, in basis points
routingFeeBps: 0

# The receiving addresses (payTo). Quote an EVM one: YAML reads an unquoted 0x… as a number. An asset
# without one is not offered to buyers. Base, Solana and Tempo's are added before the first deployment.
assets:
  - name: base-usdc
    network: eip155:8453
    address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    decimals: 6
    peg: usd
  - name: solana-usdc
    network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
    address: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
    decimals: 6
    peg: usd
  - name: tempo-usdce
    network: eip155:4217
    address: "0x20C000000000000000000000b9537d11c60E8b50"
    decimals: 6
    peg: usd
  - name: near-usdc
    network: near:mainnet
    address: 17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1
    decimals: 6
    peg: usd
    # Our NEAR hot wallet: buyers pay it, and the Signer pays NEAR targets from it
    payTo: pay.anyfare.near

# One facilitator per network. Auth names environment variables; their values are never in this file.
facilitators:
  - name: cdp
    url: https://api.cdp.coinbase.com/platform/v2/x402
    networks: [eip155:8453, solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp]
    auth:
      type: cdp
      apiKeyId: CDP_API_KEY_ID
      apiKeySecret: CDP_API_KEY_SECRET
  - name: near
    url: http://facilitator:8084
    networks: [near:mainnet]
    auth:
      type: api-key
      apiKey: FACILITATOR_SECRET

# The Tempo charge. The recipient, our Tempo address, is added before the first deployment, with the
# tempo-usdce asset's payTo. MPP is not offered to buyers until then.
mpp:
  network: eip155:4217

rateLimits:
  paymentKey: { requests: 600, windowSeconds: 60 }
  unpaidIp: { requests: 60, windowSeconds: 60 }
  # A hackathon venue shares one IP, so the sign-up limit is high.
  signup: { requests: 200, windowSeconds: 3600 }
  # The website's server reads the public documents for every visitor, from one IP
  documents: { requests: 600, windowSeconds: 60 }

# Free Credits for each new account: off until the operator turns the gift on
freeCredits:
  enabled: false
  amount: "0.1"
  perIp: { requests: 3, windowSeconds: 86400 }   # Per client IP. Later accounts are created with none
  # maxPerDay: "5"   # Optional. The most given across all IPs in one UTC day. Without it there is no cap

timeouts:
  connectMs: 5000
  requestMs: 30000
  settleMs: 30000

# What one routed call and one network can cost us, and the hot wallets' public addresses, never their
# keys. Base, Tempo and Solana's are added before the first deployment.
signer:
  maxPerCall: "0.1"
  maxPerNetworkPerHour: "5"
  maxPerNetworkPerDay: "20"
  wallets:
    near: pay.anyfare.near
