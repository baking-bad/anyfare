name: anyfare

services:
  db:
    image: postgres:18
    ports:
      - 127.0.0.1:${POSTGRES__PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES__USER:-anyfare}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:-anyfare}
      POSTGRES_DB: ${POSTGRES__DB:-anyfare}
    volumes:
      - ./.tmp/db_data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES__USER:-anyfare} -d ${POSTGRES__DB:-anyfare}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    # The replay store must never lose a key, so persistence is on and eviction is off.
    command:
      - redis-server
      - --requirepass
      - ${REDIS__PASSWORD:-anyfare}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - 127.0.0.1:${REDIS__PORT:-6379}:6379
    volumes:
      - ./.tmp/redis_data:/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS__PASSWORD:-anyfare} --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Signer's own Redis, apart from the one the proxy and the API use
  signer-redis:
    image: redis:8
    command:
      - redis-server
      - --requirepass
      - ${SIGNER_REDIS_PASSWORD:-anyfare}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - 127.0.0.1:${SIGNER_REDIS__PORT:-6381}:6379
    volumes:
      - ./.tmp/signer_redis_data:/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${SIGNER_REDIS_PASSWORD:-anyfare} --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
